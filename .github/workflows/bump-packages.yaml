# Bumps the package version from the conventional commit messages merged since
# the last bump, and commits the result to main.
#
# This workflow runs on its own bump commit too, but then there are no commits
# since the last bump, so nothing changes and nothing is pushed.
name: Bump packages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Check and Test']
    branches: [main]
    types:
      - completed

permissions:
  contents: none # we use the github app's token to checkout and push

jobs:
  bump:
    name: Bump packages

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - uses: mongodb-js/devtools-shared/actions/setup-bot-token@main # main
        id: app-token
        with:
          app-id: ${{ vars.DEVTOOLS_BOT_APP_ID }}
          private-key: ${{ secrets.DEVTOOLS_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # don't checkout a detached HEAD
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          token: ${{ steps.app-token.outputs.token }}

          # this is important so git log has the whole history
          fetch-depth: '0'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: 'npm'

      - name: Install npm
        run: npm install -g npm@11.16.0

      - name: Install Dependencies
        run: npm ci

      - name: Bump packages
        run: |
          npm run bump-packages
          git add .
          git commit --no-allow-empty -m "chore(ci): bump packages" || true
          git push origin HEAD:main
